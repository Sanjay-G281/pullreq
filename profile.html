<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      place-items: center;
      background: #f1f5f9;
      color: #1e293b;
      font-family: Arial, sans-serif;
    }

    .profile-card {
      width: min(100%, 24rem);
      padding: 2rem;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 12px 30px rgb(15 23 42 / 10%);
      text-align: center;
    }

    .avatar {
      display: grid;
      width: 5rem;
      height: 5rem;
      margin: 0 auto 1rem;
      place-items: center;
      border-radius: 50%;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 1.5rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .role {
      margin: 0.5rem 0 1rem;
      color: #64748b;
    }

    .introduction {
      line-height: 1.6;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.25rem 0;
      padding: 0;
      list-style: none;
    }

    .skills li {
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 0.875rem;
    }

    .profile-link {
      display: inline-block;
      margin-top: 0.5rem;
      color: #1d4ed8;
      font-weight: 700;
      text-decoration: none;
    }

    .profile-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <article class="profile-card" aria-labelledby="profile-name">
      <div class="avatar" aria-hidden="true">JD</div>
      <h1 id="profile-name">Jordan Doe</h1>
      <p class="role">Frontend Developer</p>
      <p class="introduction">
        I build thoughtful, accessible web experiences and enjoy turning ideas
        into clean, responsive interfaces.
      </p>
      <ul class="skills" aria-label="Skills">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>
      <a class="profile-link" href="https://github.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit Jordan Doe's GitHub portfolio (opens in a new tab)">
        Visit my GitHub
      </a>
    </article>
  </main>
</body>
</html>
